[package]
name = "nearest-enum"
version = "0.1.0"
edition = "2024"
description = "Derive nearest/exact/ceil lookups on fieldless enums tagged with integer values, compile-time first"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Gioelio/nearest-enum"
keywords = ["enum", "no-std", "conversion", "lookup", "const-fn"]
categories = ["embedded", "no-std"]

[lib]
proc-macro = true
doctest = false

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }

[dev-dependencies]
trybuild = "1.0.120"

